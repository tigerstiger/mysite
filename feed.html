<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>SHORTXX - ショートフィード</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #fff; font-family: sans-serif; overflow: hidden; height: 100dvh; }

    #age-gate {
      position: fixed; inset: 0; background: #111;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100; gap: 24px; padding: 32px;
    }
    .logo-big { font-size: 36px; font-weight: 700; letter-spacing: 2px; }
    .logo-big span { color: #E24B4A; }
    .age-text { font-size: 15px; color: #aaa; text-align: center; line-height: 1.7; }
    .age-btn {
      width: 100%; max-width: 280px; padding: 14px;
      background: #E24B4A; color: #fff; border: none;
      border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer;
    }
    .age-no { font-size: 13px; color: #666; cursor: pointer; }

    .top-bar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 52px; z-index: 10;
      background: linear-gradient(#111 50%, transparent);
      display: flex; align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .logo { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
    .logo span { color: #E24B4A; }

    .tags {
      position: fixed; top: 52px; left: 0; right: 0;
      display: flex; gap: 8px; padding: 0 16px 12px;
      overflow-x: auto; scrollbar-width: none; z-index: 10;
    }
    .tags::-webkit-scrollbar { display: none; }
    .tag {
      flex-shrink: 0; padding: 6px 14px;
      background: rgba(255,255,255,0.1);
      border: 0.5px solid rgba(255,255,255,0.2);
      border-radius: 20px; font-size: 12px; color: #fff; cursor: pointer;
      white-space: nowrap;
    }
    .tag.active { background: #E24B4A; border-color: #E24B4A; }

    #feed {
      height: 100dvh; overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    #feed::-webkit-scrollbar { display: none; }

    .card {
      height: 100dvh; scroll-snap-align: start;
      position: relative; background: #0d0d0d;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    .card-thumb {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .card-thumb img {
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0.5;
    }

    .video-wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .video-wrap video {
      width: 100%; height: 100%; object-fit: cover;
    }

    .play-btn {
      position: absolute;
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 3;
      transition: opacity 0.3s;
    }
    .play-btn.hidden { opacity: 0; pointer-events: none; }
    .play-triangle {
      width: 0; height: 0;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      border-left: 24px solid rgba(255,255,255,0.9);
      margin-left: 5px;
    }

    .side-actions {
      position: absolute; right: 12px; bottom: 160px;
      display: flex; flex-direction: column; gap: 20px; align-items: center;
      z-index: 4;
    }
    .side-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer;
    }
    .side-icon {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .side-icon.liked { background: #E24B4A; }
    .side-label { font-size: 11px; color: #ccc; }

    .overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 20px 16px 40px;
      background: linear-gradient(transparent, rgba(0,0,0,0.92));
      z-index: 4;
    }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 500;
      padding: 3px 8px; border-radius: 4px; margin-bottom: 6px;
      background: #E24B4A; color: #fff;
    }
    .actress { font-size: 13px; color: #E24B4A; font-weight: 500; margin-bottom: 4px; }
    .title {
      font-size: 13px; color: #fff; font-weight: 500; margin-bottom: 14px;
      line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .cta {
      width: 100%; padding: 13px; background: #E24B4A;
      color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 500; cursor: pointer;
      text-decoration: none; display: block; text-align: center;
    }

    .progress-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 2px; background: rgba(255,255,255,0.2); z-index: 5;
    }
    .progress-fill {
      height: 100%; width: 0%; background: #E24B4A;
      transition: width 0.1s linear;
    }

    .loading-screen {
      height: 100dvh; display: flex; align-items: center;
      justify-content: center; color: #666; font-size: 14px;
      scroll-snap-align: start;
    }

    .list-link {
      position: fixed; bottom: 16px; left: 16px;
      font-size: 12px; color: #666; z-index: 10;
      text-decoration: none;
      background: rgba(0,0,0,0.5);
      padding: 6px 12px; border-radius: 20px;
    }
  </style>
</head>
<body>

<div id="age-gate">
  <div class="logo-big">SHORT<span>XX</span></div>
  <p class="age-text">本サイトは成人向けコンテンツを含みます。<br>18歳以上の方のみご利用いただけます。</p>
  <button class="age-btn" onclick="enterSite()">18歳以上です・入場する</button>
  <span class="age-no" onclick="location.href='https://www.google.com'">18歳未満・退場する</span>
</div>

<div class="top-bar">
  <div class="logo">SHORT<span>XX</span></div>
</div>

<div class="tags">
  <div class="tag active" onclick="filterBy(this, '')">すべて</div>
  <div class="tag" onclick="filterBy(this, '素人')">素人</div>
  <div class="tag" onclick="filterBy(this, '巨乳')">巨乳</div>
  <div class="tag" onclick="filterBy(this, 'NTR')">NTR</div>
  <div class="tag" onclick="filterBy(this, '個人撮影')">個人撮影</div>
  <div class="tag" onclick="filterBy(this, '初撮り')">初撮り</div>
  <div class="tag" onclick="filterBy(this, '人妻')">人妻</div>
  <div class="tag" onclick="filterBy(this, '美少女')">美少女</div>
</div>

<div id="feed">
  <div class="loading-screen">FANZAから最新作品を取得中...</div>
</div>

<a class="list-link" href="index.html">一覧で見る</a>

<script>
  const API_ID = 'HLU1m5DsrpWrznMhuenE';
  const PROXY = 'https://corsproxy.io/?';
  const BADGES = ['昨日の売上1位', 'SNSでバズ中', '人気急上昇', '今週の新着', '殿堂入り', '注目作品'];

  function enterSite() {
    document.getElementById('age-gate').style.display = 'none';
    localStorage.setItem('age_verified', '1');
  }
  if (localStorage.getItem('age_verified')) {
    document.getElementById('age-gate').style.display = 'none';
  }

  function filterBy(el, keyword) {
    document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    loadItems(keyword);
  }

  function toggleLike(btn) {
    const icon = btn.querySelector('.side-icon');
    icon.classList.toggle('liked');
  }

  async function loadItems(keyword = '') {
    const feed = document.getElementById('feed');
    feed.innerHTML = '<div class="loading-screen">FANZAから最新作品を取得中...</div>';

    const params = new URLSearchParams({
      api_id: API_ID,
      affiliate_id: 'tigerstiger-990',
      site: 'FANZA',
      service: 'digital',
      floor: 'videoa',
      hits: '20',
      sort: 'rank',
      output: 'json'
    });
    if (keyword) params.set('keyword', keyword);

    const url = PROXY + encodeURIComponent(`https://api.dmm.com/affiliate/v3/ItemList?${params}`);

    try {
      const res = await fetch(url);
      const data = await res.json();
      const items = data?.result?.items;
      if (!items || items.length === 0) {
        feed.innerHTML = '<div class="loading-screen">作品が見つかりませんでした。</div>';
        return;
      }

      feed.innerHTML = items.map((item, i) => {
        const title = item.title || '';
        const actress = item.iteminfo?.actress?.[0]?.name || '女優情報なし';
        const thumb = item.imageURL?.large || item.imageURL?.list || '';
        const sampleMovie = item.sampleMovieURL?.size_720_480 || item.sampleMovieURL?.size_476_306 || '';
        const productUrl = item.URL || '';
        const link = productUrl
          ? `https://al.fanza.co.jp/?lurl=${encodeURIComponent(productUrl)}&af_id=tigerstiger-002&ch=search_link&ch_id=link`
          : '#';
        const badge = BADGES[i % BADGES.length];

        return `
        <div class="card" data-index="${i}">
          <div class="card-thumb">
            ${thumb ? `<img src="${thumb}" alt="${actress}">` : ''}
          </div>
          ${sampleMovie ? `
          <div class="video-wrap">
            <video src="${sampleMovie}" playsinline muted loop preload="none"></video>
          </div>` : ''}
          <div class="play-btn" onclick="togglePlay(this)">
            <div class="play-triangle"></div>
          </div>
          <div class="side-actions">
            <div class="side-btn" onclick="toggleLike(this)">
              <div class="side-icon">♡</div>
              <span class="side-label">いいね</span>
            </div>
            <div class="side-btn" onclick="skipCard(${i})">
              <div class="side-icon">↷</div>
              <span class="side-label">スキップ</span>
            </div>
          </div>
          <div class="overlay">
            <span class="badge">${badge}</span>
            <div class="actress">${actress}</div>
            <div class="title">${title}</div>
            <a class="cta" href="${link}" target="_blank">続きを見る →</a>
          </div>
          <div class="progress-bar"><div class="progress-fill"></div></div>
        </div>`;
      }).join('');

      setupIntersection();

    } catch (e) {
      feed.innerHTML = '<div class="loading-screen">データの取得に失敗しました。</div>';
    }
  }

  function togglePlay(btn) {
    const card = btn.closest('.card');
    const video = card.querySelector('video');
    if (!video) return;
    if (video.paused) {
      video.play();
      btn.classList.add('hidden');
    } else {
      video.pause();
      btn.classList.remove('hidden');
    }
  }

  function skipCard(index) {
    const cards = document.querySelectorAll('.card');
    if (cards[index + 1]) {
      cards[index + 1].scrollIntoView({ behavior: 'smooth' });
    }
  }

  function setupIntersection() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target.querySelector('video');
        const playBtn = entry.target.querySelector('.play-btn');
        if (entry.isIntersecting) {
          if (video) {
            video.play().then(() => {
              if (playBtn) playBtn.classList.add('hidden');
            }).catch(() => {});
          }
        } else {
          if (video) {
            video.pause();
            video.currentTime = 0;
            if (playBtn) playBtn.classList.remove('hidden');
          }
        }
      });
    }, { threshold: 0.7 });

    document.querySelectorAll('.card').forEach(card => observer.observe(card));
  }

  loadItems();
</script>
</body>
</html>
