<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SHORTXX PREMIUM</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --primary: #FF2D55;
      --bg: #000;
      --glass: rgba(255, 255, 255, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background: var(--bg); 
      color: #fff; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      overflow: hidden; 
      height: 100dvh; 
      width: 100%;
      position: fixed;
    }

    /* プレミアム年齢確認 */
    #age-gate {
      position: fixed; inset: 0; background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 2000; padding: 40px; text-align: center;
    }
    .gate-logo { font-size: 48px; font-weight: 800; margin-bottom: 10px; }
    .gate-logo span { color: var(--primary); }
    .age-btn {
      width: 100%; max-width: 320px; padding: 20px;
      background: var(--primary); color: #fff; border: none;
      border-radius: 16px; font-size: 18px; font-weight: 700;
      margin-top: 40px; box-shadow: 0 10px 30px rgba(255,45,85,0.4);
    }

    /* タグバー（グラスモーフィズム） */
    .nav-header {
      position: fixed; top: 0; width: 100%; z-index: 1000;
      padding-top: env(safe-area-inset-top);
      background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
    }
    .tag-scroll {
      display: flex; gap: 12px; padding: 15px; overflow-x: auto; scrollbar-width: none;
    }
    .tag-scroll::-webkit-scrollbar { display: none; }
    .tag {
      flex-shrink: 0; padding: 8px 20px; background: var(--glass);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-radius: 40px; font-size: 13px; font-weight: 600; border: 1px solid rgba(255,255,255,0.1);
    }
    .tag.active { background: var(--primary); border-color: var(--primary); }

    /* メインフィード */
    #feed {
      height: 100dvh; overflow-y: scroll; scroll-snap-type: y mandatory;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    #feed::-webkit-scrollbar { display: none; }

    .card {
      height: 100dvh; width: 100%; scroll-snap-align: start;
      position: relative; background: #000; overflow: hidden;
    }

    /* ビデオ表示エリア */
    .video-shell {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 1;
    }
    iframe { width: 100%; height: 100%; border: none; pointer-events: none; }

    /* サムネイル・ポスター（読み込み中・タップ待ち） */
    .poster-layer {
      position: absolute; inset: 0; z-index: 10;
      background-size: cover; background-position: center;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.4s ease-out;
    }
    .poster-layer.hidden { opacity: 0; pointer-events: none; }
    .poster-layer::before {
      content: ''; position: absolute; inset: 0; 
      background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.4) 100%);
    }

    .play-trigger {
      width: 80px; height: 80px; border-radius: 50%;
      background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #fff; z-index: 11;
    }
    .play-icon {
      width: 0; height: 0; border-top: 15px solid transparent;
      border-bottom: 15px solid transparent; border-left: 25px solid #fff;
      margin-left: 8px;
    }

    /* UIレイヤー */
    .ui-layer {
      position: absolute; inset: 0; z-index: 20;
      pointer-events: none;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 0 16px calc(40px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 50%);
    }
    .ui-layer * { pointer-events: auto; }

    .side-bar {
      position: absolute; right: 12px; bottom: 180px;
      display: flex; flex-direction: column; gap: 24px;
    }
    .action-btn { 
      display: flex; flex-direction: column; align-items: center; gap: 6px; 
      background: none; border: none; color: #fff;
    }
    .icon-box {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--glass); backdrop-filter: blur(15px);
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .icon-box.active { color: var(--primary); }

    .info-pane { max-width: 80%; }
    .info-pane .actress { font-size: 18px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
    .info-pane .title { font-size: 14px; line-height: 1.5; color: #eee; margin-bottom: 20px; font-weight: 500; }
    .cta-btn {
      display: inline-block; background: #fff; color: #000; padding: 12px 30px;
      border-radius: 12px; font-weight: 800; text-decoration: none; font-size: 14px;
    }

  </style>
</head>
<body>

<div id="age-gate">
  <div class="gate-logo">SHORT<span>XX</span></div>
  <p style="color: #666; font-weight: 600;">PREMIUM ADULT CONTENT</p>
  <button class="age-btn" onclick="startApp()">18歳以上・入場する</button>
</div>

<div class="nav-header">
  <div class="tag-scroll">
    <div class="tag active" onclick="changeCategory(this, '')">おすすめ</div>
    <div class="tag" onclick="changeCategory(this, '素人')">素人</div>
    <div class="tag" onclick="changeCategory(this, '個人撮影')">個人</div>
    <div class="tag" onclick="changeCategory(this, '巨乳')">巨乳</div>
    <div class="tag" onclick="changeCategory(this, '人妻')">人妻</div>
    <div class="tag" onclick="changeCategory(this, '美少女')">美少女</div>
  </div>
</div>

<div id="feed"></div>

<script>
  const API_KEY = 'HLU1m5DsrpWrznMhuenE';
  const AFFI_ID = 'tigerstiger-990';
  const PROXY = 'https://corsproxy.io/?';

  let state = {
    page: 1,
    keyword: '',
    isLoading: false,
    favorites: JSON.parse(localStorage.getItem('favs') || '[]'),
    isAppStarted: false
  };

  function startApp() {
    state.isAppStarted = true;
    localStorage.setItem('age_verified', '1');
    document.getElementById('age-gate').style.display = 'none';
    loadVideos(true);
  }

  async function loadVideos(reset = false) {
    if (state.isLoading) return;
    state.isLoading = true;
    if (reset) { state.page = 1; document.getElementById('feed').innerHTML = ''; }

    const offset = (state.page - 1) * 20 + 1;
    const baseUrl = `https://api.dmm.com/affiliate/v3/ItemList?api_id=${API_KEY}&affiliate_id=${AFFI_ID}&site=FANZA&service=digital&floor=videoa&hits=20&offset=${offset}&sort=rank&output=json`;
    const finalUrl = PROXY + encodeURIComponent(baseUrl + (state.keyword ? `&keyword=${state.keyword}` : ''));

    try {
      const res = await fetch(finalUrl);
      const data = await res.json();
      const items = data.result.items;
      
      const feed = document.getElementById('feed');
      items.forEach(item => feed.appendChild(createVideoCard(item)));
      
      state.page++;
      setupObserver();
    } catch (e) { console.error("Load Error"); }
    state.isLoading = false;
  }

  function createVideoCard(item) {
    const cid = item.content_id;
    const thumb = item.imageURL.large;
    const actress = item.iteminfo.actress ? item.iteminfo.actress[0].name : "Exclusive";
    const isLiked = state.favorites.includes(cid) ? 'active' : '';

    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.cid = cid;
    card.innerHTML = `
      <div class="video-shell">
        <iframe data-src="https://www.dmm.co.jp/litevideo/-/part/=/cid=${cid}/size=476_306/affi_id=${AFFI_ID}/?autoplay=1&mute=0" allow="autoplay; fullscreen"></iframe>
      </div>
      <div class="poster-layer" style="background-image:url(${thumb})" onclick="playVideo(this)">
        <div class="play-trigger"><div class="play-icon"></div></div>
      </div>
      <div class="side-bar">
        <div class="action-btn" onclick="toggleFav(this, '${cid}')">
          <div class="icon-box ${isLiked}">❤︎</div>
          <span style="font-size:10px; font-weight:700;">いいね</span>
        </div>
        <div class="action-btn" onclick="window.open('${item.affiliateURL}', '_blank')">
          <div class="icon-box">🛒</div>
          <span style="font-size:10px; font-weight:700;">購入</span>
        </div>
      </div>
      <div class="ui-layer">
        <div class="info-pane">
          <div class="actress">@${actress}</div>
          <div class="title">${item.title}</div>
          <a href="${item.affiliateURL}" class="cta-btn" target="_blank">フルバージョンを見る</a>
        </div>
      </div>
    `;
    return card;
  }

  // 重要：iOSで確実に再生するための処理
  function playVideo(poster) {
    const card = poster.closest('.card');
    const iframe = card.querySelector('iframe');
    
    // 1. ポスターを消す
    poster.classList.add('hidden');
    
    // 2. iframeにsrcを入れて再生開始
    if (!iframe.src) {
      iframe.src = iframe.dataset.src;
    }
  }

  function toggleFav(btn, cid) {
    const icon = btn.querySelector('.icon-box');
    if (state.favorites.includes(cid)) {
      state.favorites = state.favorites.filter(id => id !== cid);
      icon.classList.remove('active');
    } else {
      state.favorites.push(cid);
      icon.classList.add('active');
    }
    localStorage.setItem('favs', JSON.stringify(state.favorites));
  }

  function changeCategory(el, key) {
    document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    state.keyword = key;
    loadVideos(true);
  }

  function setupObserver() {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const iframe = entry.target.querySelector('iframe');
        const poster = entry.target.querySelector('.poster-layer');
        
        if (entry.isIntersecting) {
          // 画面内に入っても、勝手にsrcを入れない（タップを待つ）
          // ただし、既に再生済みの場合は何もしない
        } else {
          // 完全に画面外に出た時だけリセットして重さを解消
          iframe.src = '';
          poster.classList.remove('hidden');
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.card').forEach(c => observer.observe(c));
  }

  document.getElementById('feed').addEventListener('scroll', () => {
    const f = document.getElementById('feed');
    if (f.scrollHeight - f.scrollTop - f.clientHeight < 800) loadVideos();
  });

  if (localStorage.getItem('age_verified')) startApp();
</script>
</body>
</html>
