<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>SHORTXX - ショートフィード</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #fff; font-family: sans-serif; overflow: hidden; height: 100dvh; }

    #age-gate {
      position: fixed; inset: 0; background: #111;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100; gap: 24px; padding: 32px;
    }
    .logo-big { font-size: 36px; font-weight: 700; letter-spacing: 2px; }
    .logo-big span { color: #E24B4A; }
    .age-text { font-size: 15px; color: #aaa; text-align: center; line-height: 1.7; }
    .age-btn {
      width: 100%; max-width: 280px; padding: 14px;
      background: #E24B4A; color: #fff; border: none;
      border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer;
    }
    .age-no { font-size: 13px; color: #666; cursor: pointer; }

    .top-bar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 52px; z-index: 10;
      background: linear-gradient(#111 50%, transparent);
      display: flex; align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .logo { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
    .logo span { color: #E24B4A; }

    .tags {
      position: fixed; top: 52px; left: 0; right: 0;
      display: flex; gap: 8px; padding: 0 16px 12px;
      overflow-x: auto; scrollbar-width: none; z-index: 10;
    }
    .tags::-webkit-scrollbar { display: none; }
    .tag {
      flex-shrink: 0; padding: 6px 14px;
      background: rgba(255,255,255,0.1);
      border: 0.5px solid rgba(255,255,255,0.2);
      border-radius: 20px; font-size: 12px; color: #fff; cursor: pointer;
      white-space: nowrap;
    }
    .tag.active { background: #E24B4A; border-color: #E24B4A; }

    #feed {
      height: 100dvh; overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    #feed::-webkit-scrollbar { display: none; }

    .card {
      height: 100dvh; scroll-snap-align: start;
      position: relative; background: #0d0d0d;
      overflow: hidden;
    }

    .card-thumb {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .card-thumb img {
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0.4;
    }

    .iframe-wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 2;
    }
    .iframe-wrap iframe {
      width: 100%; height: 60%;
      border: none; background: transparent;
    }

    .tap-overlay {
      position: absolute; inset: 0;
      z-index: 3; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .tap-overlay.playing { pointer-events: none; }

    .play-btn {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.3s;
    }
    .play-btn.hidden { opacity: 0; }
    .play-triangle {
      width: 0; height: 0;
      border-top: 13px solid transparent;
      border-bottom: 13px solid transparent;
      border-left: 24px solid rgba(255,255,255,0.9);
      margin-left: 5px;
    }

    .side-actions {
      position: absolute; right: 12px; bottom: 160px;
      display: flex; flex-direction: column; gap: 20px; align-items: center;
      z-index: 4;
    }
    .side-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer;
    }
    .side-icon {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .side-icon.liked { background: #E24B4A; }
    .side-label { font-size: 11px; color: #ccc; }

    .overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 20px 16px 40px;
      background: linear-gradient(transparent, rgba(0,0,0,0.95));
      z-index: 4;
    }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 500;
      padding: 3px 8px; border-radius: 4px; margin-bottom: 6px;
      background: #E24B4A; color: #fff;
    }
    .actress { font-size: 13px; color: #E24B4A; font-weight: 500; margin-bottom: 4px; }
    .title {
      font-size: 13px; color: #fff; font-weight: 500; margin-bottom: 14px;
      line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .cta {
      width: 100%; padding: 13px; background: #E24B4A;
      color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 500; cursor: pointer;
      text-decoration: none; display: block; text-align: center;
    }

    .loading-card {
      height: 100dvh; display: flex; align-items: center;
      justify-content: center; color: #666; font-size: 14px;
      scroll-snap-align: start;
    }

    .list-link {
      position: fixed; bottom: 16px; left: 16px;
      font-size: 12px; color: #666; z-index: 10;
      text-decoration: none;
      background: rgba(0,0,0,0.5);
      padding: 6px 12px; border-radius: 20px;
    }
  </style>
</head>
<body>

<div id="age-gate">
  <div class="logo-big">SHORT<span>XX</span></div>
  <p class="age-text">本サイトは成人向けコンテンツを含みます。<br>18歳以上の方のみご利用いただけます。</p>
  <button class="age-btn" onclick="enterSite()">18歳以上です・入場する</button>
  <span class="age-no" onclick="location.href='https://www.google.com'">18歳未満・退場する</span>
</div>

<div class="top-bar">
  <div class="logo">SHORT<span>XX</span></div>
</div>

<div class="tags">
  <div class="tag active" onclick="filterBy(this, '')">すべて</div>
  <div class="tag" onclick="filterBy(this, '素人')">素人</div>
  <div class="tag" onclick="filterBy(this, '巨乳')">巨乳</div>
  <div class="tag" onclick="filterBy(this, 'NTR')">NTR</div>
  <div class="tag" onclick="filterBy(this, '個人撮影')">個人撮影</div>
  <div class="tag" onclick="filterBy(this, '初撮り')">初撮り</div>
  <div class="tag" onclick="filterBy(this, '人妻')">人妻</div>
  <div class="tag" onclick="filterBy(this, '美少女')">美少女</div>
</div>

<div id="feed"></div>

<a class="list-link" href="index.html">一覧で見る</a>

<script>
  const API_ID = 'HLU1m5DsrpWrznMhuenE';
  const PROXY = 'https://corsproxy.io/?';
  const BADGES = ['昨日の売上1位', 'SNSでバズ中', '人気急上昇', '今週の新着', '殿堂入り', '注目作品'];

  let currentPage = 1;
  let currentKeyword = '';
  let isLoading = false;
  let hasMore = true;
  let activated = false;
  let observer = null;

  function enterSite() {
    document.getElementById('age-gate').style.display = 'none';
    localStorage.setItem('age_verified', '1');
    activated = true;
    loadItems(currentKeyword, true);
  }

  if (localStorage.getItem('age_verified')) {
    document.getElementById('age-gate').style.display = 'none';
    activated = true;
    loadItems(currentKeyword, true);
  }

  function filterBy(el, keyword) {
    document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentKeyword = keyword;
    currentPage = 1;
    hasMore = true;
    document.getElementById('feed').innerHTML = '';
    if (observer) { observer.disconnect(); observer = null; }
    loadItems(keyword, true);
  }

  function toggleLike(btn) {
    const icon = btn.querySelector('.side-icon');
    icon.classList.toggle('liked');
  }

  function skipNext(btn) {
    const card = btn.closest('.card');
    const next = card.nextElementSibling;
    if (next) next.scrollIntoView({ behavior: 'smooth' });
  }

  function activateCard(overlay) {
    const card = overlay.closest('.card');
    const iframe = card.querySelector('iframe');
    const playBtn = overlay.querySelector('.play-btn');
    if (iframe && !iframe.src) {
      iframe.src = iframe.dataset.src;
    }
    if (playBtn) playBtn.classList.add('hidden');
    overlay.classList.add('playing');
  }

  function makeCard(item, i) {
    const title = item.title || '';
    const actress = item.iteminfo?.actress?.[0]?.name || '女優情報なし';
    const thumb = item.imageURL?.large || item.imageURL?.list || '';
    const cid = item.content_id || '';
    const affiliateUrl = item.affiliateURL || '#';
    const badge = BADGES[i % BADGES.length];
    const iframeSrc = cid
      ? `https://www.dmm.co.jp/litevideo/-/part/=/cid=${cid}/size=476_306/affi_id=tigerstiger-990/?autoplay=1&mute=1`
      : '';

    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div class="card-thumb">
        ${thumb ? `<img src="${thumb}" alt="${actress}" loading="lazy">` : ''}
      </div>
      ${iframeSrc ? `
      <div class="iframe-wrap">
        <iframe data-src="${iframeSrc}" allowfullscreen scrolling="no" allow="autoplay; muted; fullscreen"></iframe>
      </div>` : ''}
      <div class="tap-overlay" onclick="activateCard(this)">
        <div class="play-btn">
          <div class="play-triangle"></div>
        </div>
      </div>
      <div class="side-actions">
        <div class="side-btn" onclick="toggleLike(this)">
          <div class="side-icon">♡</div>
          <span class="side-label">いいね</span>
        </div>
        <div class="side-btn" onclick="skipNext(this)">
          <div class="side-icon">↷</div>
          <span class="side-label">スキップ</span>
        </div>
      </div>
      <div class="overlay">
        <span class="badge">${badge}</span>
        <div class="actress">${actress}</div>
        <div class="title">${title}</div>
        <a class="cta" href="${affiliateUrl}" target="_blank">続きを見る →</a>
      </div>`;
    return div;
  }

  async function loadItems(keyword = '', reset = false) {
    if (isLoading || !hasMore) return;
    isLoading = true;

    if (reset) currentPage = 1;

    const feed = document.getElementById('feed');

    const loader = document.createElement('div');
    loader.className = 'loading-card';
    loader.id = 'loader';
    loader.textContent = '読み込み中...';
    feed.appendChild(loader);

    const offset = (currentPage - 1) * 20 + 1;
    const params = new URLSearchParams({
      api_id: API_ID,
      affiliate_id: 'tigerstiger-990',
      site: 'FANZA',
      service: 'digital',
      floor: 'videoa',
      hits: '20',
      offset: String(offset),
      sort: 'rank',
      output: 'json'
    });
    if (keyword) params.set('keyword', keyword);

    const url = PROXY + encodeURIComponent(`https://api.dmm.com/affiliate/v3/ItemList?${params}`);

    try {
      const res = await fetch(url);
      const data = await res.json();
      const items = data?.result?.items;

      document.getElementById('loader')?.remove();

      if (!items || items.length === 0) {
        hasMore = false;
        isLoading = false;
        return;
      }

      const fragment = document.createDocumentFragment();
      items.forEach((item, i) => {
        const card = makeCard(item, (currentPage - 1) * 20 + i);
        fragment.appendChild(card);
      });
      feed.appendChild(fragment);

      currentPage++;
      isLoading = false;

      setupIntersection();
      setupScrollEnd();

    } catch (e) {
      document.getElementById('loader')?.remove();
      isLoading = false;
    }
  }

  function setupIntersection() {
    if (observer) observer.disconnect();

    observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const card = entry.target;
        const iframe = card.querySelector('iframe');
        const overlay = card.querySelector('.tap-overlay');
        const playBtn = card.querySelector('.play-btn');

        if (entry.isIntersecting) {
          if (iframe && !iframe.src && activated) {
            iframe.src = iframe.dataset.src;
            if (playBtn) playBtn.classList.add('hidden');
            if (overlay) overlay.classList.add('playing');
          }
        } else {
          if (iframe && iframe.src) {
            iframe.src = '';
            if (playBtn) playBtn.classList.remove('hidden');
            if (overlay) overlay.classList.remove('playing');
          }
        }
      });
    }, { threshold: 0.8 });

    document.querySelectorAll('.card').forEach(card => observer.observe(card));
  }

  function setupScrollEnd() {
    const feed = document.getElementById('feed');
    feed.removeEventListener('scroll', onScroll);
    feed.addEventListener('scroll', onScroll);
  }

  function onScroll() {
    const feed = document.getElementById('feed');
    const remaining = feed.scrollHeight - feed.scrollTop - feed.clientHeight;
    if (remaining < feed.clientHeight * 2 && !isLoading && hasMore) {
      loadItems(currentKeyword);
    }
  }
</script>
</body>
</html>
