<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SHORTXX - ショートフィード</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SHORTXX">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #111; color: #fff; font-family: sans-serif; overflow: hidden; height: 100dvh; position: fixed; width: 100%; }

    /* 年齢確認ゲート */
    #age-gate {
      position: fixed; inset: 0; background: #111;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100; gap: 24px; padding: 32px;
    }
    .logo-big { font-size: 36px; font-weight: 700; letter-spacing: 2px; }
    .logo-big span { color: #E24B4A; }
    .age-btn {
      width: 100%; max-width: 280px; padding: 14px;
      background: #E24B4A; color: #fff; border: none;
      border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer;
    }

    /* 上部バー & タグ */
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 52px; z-index: 10;
      background: linear-gradient(#111 50%, transparent);
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .logo { font-size: 16px; font-weight: 700; letter-spacing: 1px; pointer-events: auto; }
    .logo span { color: #E24B4A; }

    .tags {
      position: fixed; top: 52px; left: 0; right: 0;
      display: flex; gap: 8px; padding: 0 16px 12px;
      overflow-x: auto; scrollbar-width: none; z-index: 10;
    }
    .tags::-webkit-scrollbar { display: none; }
    .tag {
      flex-shrink: 0; padding: 6px 14px;
      background: rgba(255,255,255,0.1);
      border: 0.5px solid rgba(255,255,255,0.2);
      border-radius: 20px; font-size: 12px; color: #fff; cursor: pointer;
    }
    .tag.active { background: #E24B4A; border-color: #E24B4A; }

    /* フィードエリア */
    #feed {
      height: 100dvh; overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    #feed::-webkit-scrollbar { display: none; }

    .card {
      height: 100dvh; scroll-snap-align: start;
      position: relative; background: #0d0d0d;
      overflow: hidden;
    }

    .card-thumb { position: absolute; inset: 0; }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0.4; }

    .iframe-wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 1; pointer-events: none;
    }
    .iframe-wrap iframe { width: 100%; height: 60%; border: none; }

    /* 再生オーバーレイ（ここが重要） */
    .tap-overlay {
      position: absolute; inset: 0; z-index: 5; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .tap-overlay::after {
      content: 'TAP TO UNMUTE 🔊';
      position: absolute; bottom: 22%;
      background: rgba(0,0,0,0.6); padding: 8px 16px;
      border-radius: 20px; font-size: 11px; color: #fff;
      animation: pulse 1.5s infinite;
    }
    .tap-overlay.playing::after { display: none; }

    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.5; transform: scale(0.95); }
    }

    .play-btn {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
    }
    .play-btn.hidden { display: none; }
    .play-triangle {
      width: 0; height: 0;
      border-top: 13px solid transparent; border-bottom: 13px solid transparent;
      border-left: 24px solid rgba(255,255,255,0.9); margin-left: 5px;
    }

    /* サイドボタン */
    .side-actions {
      position: absolute; right: 12px; bottom: 160px;
      display: flex; flex-direction: column; gap: 20px; align-items: center;
      z-index: 10;
    }
    .side-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .side-icon {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .side-icon.liked { background: #E24B4A; }
    .side-label { font-size: 11px; color: #ccc; }

    /* 下部情報 */
    .overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 20px 16px 40px;
      background: linear-gradient(transparent, rgba(0,0,0,0.95));
      z-index: 8;
    }
    .badge {
      display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 4px; margin-bottom: 6px;
      background: #E24B4A; color: #fff;
    }
    .actress { font-size: 13px; color: #E24B4A; font-weight: 500; margin-bottom: 4px; }
    .title {
      font-size: 13px; color: #fff; margin-bottom: 14px;
      line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .cta {
      width: 100%; padding: 13px; background: #E24B4A; color: #fff;
      border-radius: 10px; font-size: 15px; text-decoration: none; display: block; text-align: center;
    }

    .loading-card { height: 100dvh; display: flex; align-items: center; justify-content: center; color: #666; }
  </style>
</head>
<body>

<div id="age-gate">
  <div class="logo-big">SHORT<span>XX</span></div>
  <p class="age-text">本サイトは成人向けコンテンツを含みます。<br>18歳以上の方のみご利用いただけます。</p>
  <button class="age-btn" onclick="enterSite()">18歳以上です・入場する</button>
</div>

<div class="top-bar"><div class="logo">SHORT<span>XX</span></div></div>

<div class="tags">
  <div class="tag active" onclick="filterBy(this, '')">すべて</div>
  <div class="tag" onclick="filterBy(this, '素人')">素人</div>
  <div class="tag" onclick="filterBy(this, '巨乳')">巨乳</div>
  <div class="tag" onclick="filterBy(this, '人妻')">人妻</div>
  <div class="tag" onclick="filterBy(this, '美少女')">美少女</div>
</div>

<div id="feed"></div>

<script>
  const API_ID = 'HLU1m5DsrpWrznMhuenE';
  const AFFILIATE_ID = 'tigerstiger-990';
  const PROXY = 'https://corsproxy.io/?';

  let currentPage = 1;
  let currentKeyword = '';
  let isLoading = false;
  let hasMore = true;
  let activated = false;
  let favorites = JSON.parse(localStorage.getItem('fav_list') || '[]');

  if (localStorage.getItem('age_verified')) {
    document.getElementById('age-gate').style.display = 'none';
    activated = true;
    loadItems('', true);
  }

  function enterSite() {
    activated = true;
    localStorage.setItem('age_verified', '1');
    document.getElementById('age-gate').style.display = 'none';
    loadItems('', true);
  }

  function filterBy(el, keyword) {
    document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentKeyword = keyword;
    currentPage = 1;
    document.getElementById('feed').innerHTML = '';
    loadItems(keyword, true);
  }

  // 動画を再生（または音を出す）
  function activateCard(overlay) {
    const card = overlay.closest('.card');
    const iframe = card.querySelector('iframe');
    const playBtn = card.querySelector('.play-btn');
    
    if (iframe) {
      const currentSrc = iframe.src || iframe.dataset.src;
      // すでに src がある場合は mute を 0 に書き換えてリロード
      if (currentSrc.includes('mute=1')) {
        iframe.src = currentSrc.replace('mute=1', 'mute=0');
      } else if (!iframe.src) {
        iframe.src = iframe.dataset.src.replace('mute=1', 'mute=0');
      }
    }
    
    overlay.classList.add('playing');
    if (playBtn) playBtn.classList.add('hidden');
  }

  function toggleLike(btn) {
    const card = btn.closest('.card');
    const cid = card.dataset.cid;
    const icon = btn.querySelector('.side-icon');
    if (favorites.includes(cid)) {
      favorites = favorites.filter(id => id !== cid);
      icon.classList.remove('liked');
    } else {
      favorites.push(cid);
      icon.classList.add('liked');
    }
    localStorage.setItem('fav_list', JSON.stringify(favorites));
  }

  function makeCard(item) {
    const title = item.title || '';
    const actress = item.iteminfo?.actress?.[0]?.name || '女優情報なし';
    const thumb = item.imageURL?.large || item.imageURL?.list || '';
    const cid = item.content_id || '';
    const isLiked = favorites.includes(cid) ? 'liked' : '';
    
    // 最初は mute=1 で設定
    const videoUrl = `https://www.dmm.co.jp/litevideo/-/part/=/cid=${cid}/size=476_306/affi_id=${AFFILIATE_ID}/?autoplay=1&mute=1`;

    const div = document.createElement('div');
    div.className = 'card';
    div.dataset.cid = cid;
    div.innerHTML = `
      <div class="card-thumb"><img src="${thumb}" loading="lazy"></div>
      <div class="iframe-wrap">
        <iframe data-src="${videoUrl}" allow="autoplay; fullscreen"></iframe>
      </div>
      <div class="tap-overlay" onclick="activateCard(this)">
        <div class="play-btn"><div class="play-triangle"></div></div>
      </div>
      <div class="side-actions">
        <div class="side-btn" onclick="toggleLike(this)">
          <div class="side-icon ${isLiked}">♡</div>
          <span class="side-label">いいね</span>
        </div>
      </div>
      <div class="overlay">
        <div class="actress">${actress}</div>
        <div class="title">${title}</div>
        <a class="cta" href="${item.affiliateURL}" target="_blank">続きを見る →</a>
      </div>`;
    return div;
  }

  async function loadItems(keyword = '', reset = false) {
    if (isLoading) return;
    isLoading = true;
    const feed = document.getElementById('feed');
    const offset = (currentPage - 1) * 20 + 1;
    const url = PROXY + encodeURIComponent(`https://api.dmm.com/affiliate/v3/ItemList?api_id=${API_ID}&affiliate_id=${AFFILIATE_ID}&site=FANZA&service=digital&floor=videoa&hits=20&offset=${offset}&sort=rank&output=json${keyword ? '&keyword='+encodeURIComponent(keyword) : ''}`);

    try {
      const res = await fetch(url);
      const data = await res.json();
      const items = data?.result?.items;
      if (items) {
        items.forEach(item => feed.appendChild(makeCard(item)));
        currentPage++;
        setupObserver();
      }
    } catch (e) { console.error(e); }
    isLoading = false;
  }

  function setupObserver() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const card = entry.target;
        const iframe = card.querySelector('iframe');
        const overlay = card.querySelector('.tap-overlay');
        const playBtn = card.querySelector('.play-btn');

        if (entry.isIntersecting) {
          // 画面に入ったら自動再生（無音）を開始
          if (activated && !iframe.src) {
            iframe.src = iframe.dataset.src;
          }
        } else {
          // 画面から消えたら停止
          iframe.src = '';
          overlay.classList.remove('playing');
          if (playBtn) playBtn.classList.remove('hidden');
        }
      });
    }, { threshold: 0.5 });
    document.querySelectorAll('.card').forEach(c => observer.observe(c));
  }

  document.getElementById('feed').addEventListener('scroll', () => {
    const f = document.getElementById('feed');
    if (f.scrollHeight - f.scrollTop - f.clientHeight < 500) loadItems(currentKeyword);
  });
</script>
</body>
</html>
