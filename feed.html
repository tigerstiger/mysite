<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SHORTXX</title>

<style>
:root {
  --primary: #FF2D55;
  --bg: #000;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color:#fff;
  overflow:hidden;
  height:100vh;
}

/* フィード */
#feed {
  height:100vh;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

.card {
  height:100vh;
  position:relative;
  scroll-snap-align:start;
}

/* iframe */
iframe {
  width:100%;
  height:100%;
  border:none;
  pointer-events:auto;
}

/* サムネ */
.poster {
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}

.poster.hidden {
  opacity:0;
  pointer-events:none;
}

/* 再生ボタン */
.play {
  width:70px;
  height:70px;
  border-radius:50%;
  background:rgba(255,255,255,0.3);
  display:flex;
  align-items:center;
  justify-content:center;
}

.play::after {
  content:'';
  border-left:20px solid #fff;
  border-top:12px solid transparent;
  border-bottom:12px solid transparent;
}
</style>
</head>

<body>

<div id="feed"></div>

<script>
const CONFIG = {
  API_KEY: 'HLU1m5DsrpWrznMhuenE',
  AFFI_ID: 'tigerstiger-990',
  PROXY: 'https://corsproxy.io/?'
};

let state = {
  page:1,
  loading:false
};

/* URL生成 */
function buildURL(cid){
  return `https://www.dmm.co.jp/litevideo/-/part/=/cid=${cid}/size=476_306/affi_id=${CONFIG.AFFI_ID}/?autoplay=1&mute=1&playsinline=1`;
}

/* カード生成 */
function createCard(item){
  const cid = item.content_id;
  const thumb = item.imageURL.large;

  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.url = buildURL(cid);
  div.dataset.playing = '0';

  div.innerHTML = `
    <iframe></iframe>
    <div class="poster" style="background-image:url(${thumb})">
      <div class="play"></div>
    </div>
  `;

  const poster = div.querySelector('.poster');
  const iframe = div.querySelector('iframe');

  poster.addEventListener('click', () => {

    if(div.dataset.playing === '0'){
      stopAll(); // 他停止

      iframe.src = div.dataset.url;
      poster.classList.add('hidden');
      div.dataset.playing = '1';

    } else {
      iframe.src = '';
      poster.classList.remove('hidden');
      div.dataset.playing = '0';
    }

  });

  return div;
}

/* 全停止 */
function stopAll(){
  document.querySelectorAll('.card').forEach(c=>{
    const iframe = c.querySelector('iframe');
    const poster = c.querySelector('.poster');

    iframe.src = '';
    poster.classList.remove('hidden');
    c.dataset.playing = '0';
  });
}

/* データ取得 */
async function load(){
  if(state.loading) return;
  state.loading = true;

  const offset = (state.page-1)*20+1;

  const url = CONFIG.PROXY + encodeURIComponent(
    `https://api.dmm.com/affiliate/v3/ItemList?api_id=${CONFIG.API_KEY}&affiliate_id=${CONFIG.AFFI_ID}&site=FANZA&service=digital&floor=videoa&hits=20&offset=${offset}`
  );

  const res = await fetch(url);
  const data = await res.json();

  const items = data.result.items;

  const feed = document.getElementById('feed');

  items.forEach(i=>{
    feed.appendChild(createCard(i));
  });

  state.page++;
  state.loading = false;
}

/* スクロールで停止 */
document.getElementById('feed').addEventListener('scroll', ()=>{
  document.querySelectorAll('.card').forEach(card=>{
    const rect = card.getBoundingClientRect();

    if(rect.top > window.innerHeight || rect.bottom < 0){
      const iframe = card.querySelector('iframe');
      const poster = card.querySelector('.poster');

      iframe.src = '';
      poster.classList.remove('hidden');
      card.dataset.playing = '0';
    }
  });

  const f = document.getElementById('feed');
  if(f.scrollHeight - f.scrollTop - f.clientHeight < 800){
    load();
  }
});

/* 初期ロード */
load();
</script>

</body>
</html>
