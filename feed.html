<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SHORTXX PREMIUM</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --primary: #FF2D55;
      --bg: #000;
      --glass: rgba(255, 255, 255, 0.15);
      --text-soft: rgba(255,255,255,0.78);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      position: fixed;
    }

    #age-gate {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 40px;
      text-align: center;
    }

    .gate-logo {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -2px;
      margin-bottom: 10px;
    }

    .gate-logo span {
      color: var(--primary);
      text-shadow: 0 0 20px rgba(255,45,85,0.4);
    }

    .age-btn {
      width: 100%;
      max-width: 320px;
      padding: 20px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 700;
      margin-top: 40px;
      box-shadow: 0 10px 30px rgba(255,45,85,0.4);
    }

    .nav-header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      padding-top: env(safe-area-inset-top);
      background: linear-gradient(to bottom, rgba(0,0,0,0.82), transparent);
    }

    .tag-scroll {
      display: flex;
      gap: 10px;
      padding: 15px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .tag-scroll::-webkit-scrollbar {
      display: none;
    }

    .tag {
      flex-shrink: 0;
      padding: 8px 18px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-soft);
      user-select: none;
    }

    .tag.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    #feed {
      height: 100dvh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background: #000;
    }

    #feed::-webkit-scrollbar {
      display: none;
    }

    .card {
      height: 100dvh;
      width: 100%;
      scroll-snap-align: start;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .bg-poster {
      position: absolute;
      inset: 0;
      z-index: 1;
      background-size: cover;
      background-position: center;
      transform: scale(1.08);
      filter: blur(18px) brightness(0.72);
      opacity: 1;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    .card.active .bg-poster {
      filter: blur(20px) brightness(0.62);
      opacity: 0.95;
    }

    .bg-poster::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0.10), rgba(0,0,0,0.58) 72%, rgba(0,0,0,0.9) 100%);
    }

    .media-shell {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: transparent;
    }

    .media-shell iframe,
    .media-shell video {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }

    .media-shell video {
      object-fit: cover;
    }

    .media-shell iframe {
      pointer-events: auto;
    }

    .poster-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      transition: opacity 0.25s ease;
      pointer-events: none;
      background: linear-gradient(rgba(0,0,0,0.08), rgba(0,0,0,0.32));
    }

    .card.playing .poster-overlay {
      opacity: 0;
    }

    .play-hint {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      border: 1px solid rgba(255,255,255,0.38);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(0,0,0,0.28);
    }

    .play-hint::after {
      content: '';
      width: 0;
      height: 0;
      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-left: 22px solid #fff;
      margin-left: 6px;
    }

    .loading-badge,
    .stop-badge,
    .tap-hint {
      position: absolute;
      z-index: 12;
      background: rgba(0,0,0,0.48);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .tap-hint {
      left: 16px;
      top: 16px;
    }

    .loading-badge {
      left: 16px;
      bottom: 230px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .stop-badge {
      right: 16px;
      top: 16px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .card.loading .loading-badge {
      opacity: 1;
    }

    .card.playing .stop-badge {
      opacity: 1;
    }

    .ui-layer {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 16px calc(30px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.42) 18%, transparent 42%);
    }

    .ui-layer * {
      pointer-events: auto;
    }

    .side-bar {
      position: absolute;
      right: 12px;
      bottom: 160px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    .icon-box {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.2s, background 0.2s, border-color 0.2s;
      user-select: none;
    }

    .icon-box:active {
      transform: scale(0.92);
    }

    .icon-box.liked {
      background: var(--primary);
      border-color: var(--primary);
    }

    .info-pane {
      max-width: 82%;
    }

    .info-pane .actress {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .info-pane .title {
      font-size: 14px;
      line-height: 1.55;
      color: #fff;
      margin-bottom: 18px;
      font-weight: 400;
      text-shadow: 0 1px 2px rgba(0,0,0,0.28);
    }

    .cta-btn {
      display: inline-block;
      background: #fff;
      color: #000;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 800;
      text-decoration: none;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(255,255,255,0.2);
    }

    .error-overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: rgba(0,0,0,0.82);
      color: #fff;
      flex-direction: column;
      gap: 14px;
    }

    .card.error .error-overlay {
      display: flex;
    }

    .error-overlay button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 800;
      background: #fff;
      color: #000;
    }
  </style>
</head>
<body>

<div id="age-gate">
  <div class="gate-logo">SHORT<span>XX</span></div>
  <p style="color:#888; letter-spacing:2px; font-size:12px;">PREMIUM SHORT FEED</p>
  <button class="age-btn" onclick="startExperience()">18歳以上・入場する</button>
</div>

<div class="nav-header">
  <div class="tag-scroll">
    <div class="tag active" onclick="changeTag(this, '')">おすすめ</div>
    <div class="tag" onclick="changeTag(this, '素人')">素人</div>
    <div class="tag" onclick="changeTag(this, '巨乳')">巨乳</div>
    <div class="tag" onclick="changeTag(this, '人妻')">人妻</div>
    <div class="tag" onclick="changeTag(this, '美少女')">美少女</div>
  </div>
</div>

<div id="feed"></div>

<script>
  const CONFIG = {
    API_KEY: 'HLU1m5DsrpWrznMhuenE',
    AFFI_ID: 'tigerstiger-990',
    PROXY: 'https://corsproxy.io/?'
  };

  const feed = document.getElementById('feed');

  let state = {
    page: 1,
    keyword: '',
    isLoading: false,
    favorites: JSON.parse(localStorage.getItem('fav_v2') || '[]'),
    isAppStarted: false,
    activeCard: null,
    rafPending: false
  };

  function isIOS() {
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  function startExperience() {
    state.isAppStarted = true;
    localStorage.setItem('age_verified_v2', '1');
    document.getElementById('age-gate').style.display = 'none';
    loadContent(true);
  }

  function escapeHTML(str) {
    return String(str)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function cssUrl(url) {
    return String(url || '').replaceAll('\\', '\\\\').replaceAll('"', '\\"');
  }

  function buildLiteVideoURL(cid) {
    return `https://www.dmm.co.jp/litevideo/-/part/=/cid=${cid}/size=476_306/affi_id=${CONFIG.AFFI_ID}/?autoplay=1&mute=1&playsinline=1`;
  }

  function getSampleURLFromItem(item) {
    const sm = item?.sampleMovieURL;
    if (!sm) return '';

    if (typeof sm === 'string') {
      return sm.trim();
    }

    if (typeof sm === 'object') {
      const keys = ['size_720_480', 'size_644_360', 'size_560_315', 'size_476_306', 'large', 'pc', 'sp', 'url'];
      for (const key of keys) {
        if (typeof sm[key] === 'string' && sm[key].trim()) return sm[key].trim();
      }
    }

    return '';
  }

  function isDirectMedia(url) {
    return /\.(mp4|m4v|mov|webm|m3u8)(\?|#|$)/i.test(url || '');
  }

  function getPreviewConfig(item) {
    const cid = item.content_id;
    const sample = getSampleURLFromItem(item);

    if (sample) {
      if (isDirectMedia(sample)) {
        return {
          kind: 'video',
          primary: sample,
          fallback: buildLiteVideoURL(cid)
        };
      }

      return {
        kind: 'iframe',
        primary: sample,
        fallback: buildLiteVideoURL(cid)
      };
    }

    return {
      kind: 'iframe',
      primary: buildLiteVideoURL(cid),
      fallback: ''
    };
  }

  function getAffiliateURL(item) {
    return item?.affiliateURL || item?.URL || item?.url || '#';
  }

  async function loadContent(reset = false) {
    if (state.isLoading) return;
    state.isLoading = true;

    if (reset) {
      state.page = 1;
      feed.innerHTML = '';
      state.activeCard = null;
    }

    const offset = (state.page - 1) * 20 + 1;
    const baseUrl =
      `https://api.dmm.com/affiliate/v3/ItemList?api_id=${CONFIG.API_KEY}` +
      `&affiliate_id=${CONFIG.AFFI_ID}&site=FANZA&service=digital&floor=videoa` +
      `&hits=20&offset=${offset}&sort=rank&output=json` +
      (state.keyword ? `&keyword=${encodeURIComponent(state.keyword)}` : '');

    const finalUrl = CONFIG.PROXY + encodeURIComponent(baseUrl);

    try {
      const res = await fetch(finalUrl);
      const data = await res.json();
      const items = data?.result?.items || [];

      items.forEach(item => feed.appendChild(createCard(item)));
      state.page++;

      if (!state.activeCard) {
        schedulePlaybackUpdate();
      }
    } catch (e) {
      console.error('Error loading items:', e);
    }

    state.isLoading = false;
  }

  function createCard(item) {
    const cid = item.content_id;
    const thumb = item?.imageURL?.large || item?.imageURL?.list || '';
    const actress = item?.iteminfo?.actress?.length ? item.iteminfo.actress[0].name : 'Exclusive';
    const isLiked = state.favorites.includes(cid) ? 'liked' : '';
    const preview = getPreviewConfig(item);
    const affiliateURL = getAffiliateURL(item);

    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.cid = cid;
    card.dataset.playing = '0';
    card.dataset.kind = preview.kind;
    card.dataset.primaryUrl = preview.primary;
    card.dataset.fallbackUrl = preview.fallback;
    card.dataset.affiliateUrl = affiliateURL;
    card.dataset.loaded = '0';

    card.innerHTML = `
      <div class="bg-poster"></div>

      <div class="media-shell">
        <video class="video-media" muted playsinline preload="none" loop style="display:none;"></video>
        <iframe class="iframe-media" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="display:none;"></iframe>
      </div>

      <div class="poster-overlay">
        <div class="play-hint"></div>
      </div>

      <div class="tap-hint">スクロールで自動再生</div>
      <div class="loading-badge">読み込み中...</div>
      <div class="stop-badge">停止中</div>

      <div class="error-overlay">
        <div style="font-size:14px; line-height:1.6;">
          埋め込み再生が不安定です。<br>
          外部ページで開くと再生できる場合があります。
        </div>
        <button onclick="openExternal(this)">外部で開く</button>
      </div>

      <div class="side-bar">
        <div class="action-btn" onclick="toggleFavorite(this, '${cid}')">
          <div class="icon-box ${isLiked}">❤︎</div>
          <span style="font-size:10px; font-weight:700; color:#ccc;">いいね</span>
        </div>
        <div class="action-btn" onclick="window.open('${affiliateURL}', '_blank')">
          <div class="icon-box">🛒</div>
          <span style="font-size:10px; font-weight:700; color:#ccc;">購入</span>
        </div>
      </div>

      <div class="ui-layer">
        <div class="info-pane">
          <div class="actress">@${escapeHTML(actress)}</div>
          <div class="title">${escapeHTML(item.title || '')}</div>
          <a href="${affiliateURL}" class="cta-btn" target="_blank" rel="noopener">本編をチェック</a>
        </div>
      </div>
    `;

    const bg = card.querySelector('.bg-poster');
    bg.style.backgroundImage = `url("${cssUrl(thumb)}")`;

    const video = card.querySelector('.video-media');
    const iframe = card.querySelector('.iframe-media');

    video.addEventListener('loadeddata', () => {
      card.classList.remove('loading');
      card.dataset.loaded = '1';
    });

    video.addEventListener('error', () => {
      const fallback = card.dataset.fallbackUrl;
      if (fallback && card.dataset.kind === 'video') {
        card.dataset.kind = 'iframe';
        stopCard(card);
        startIframeCard(card, fallback);
      } else {
        card.classList.remove('loading');
        card.classList.add('error');
      }
    });

    iframe.addEventListener('load', () => {
      card.classList.remove('loading');
      card.dataset.loaded = '1';
    });

    return card;
  }

  function toggleFavorite(btn, cid) {
    const icon = btn.querySelector('.icon-box');

    if (state.favorites.includes(cid)) {
      state.favorites = state.favorites.filter(id => id !== cid);
      icon.classList.remove('liked');
    } else {
      state.favorites.push(cid);
      icon.classList.add('liked');
    }

    localStorage.setItem('fav_v2', JSON.stringify(state.favorites));
  }

  function changeTag(el, key) {
    document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    state.keyword = key;
    loadContent(true);
  }

  function openExternal(btn) {
    const card = btn.closest('.card');
    const url = card?.dataset?.affiliateUrl || '#';
    if (url && url !== '#') window.open(url, '_blank', 'noopener');
  }

  function stopCard(card) {
    if (!card) return;

    const video = card.querySelector('.video-media');
    const iframe = card.querySelector('.iframe-media');
    const poster = card.querySelector('.poster-overlay');

    if (video) {
      video.pause();
      video.removeAttribute('src');
      video.load();
      video.style.display = 'none';
    }

    if (iframe) {
      iframe.src = '';
      iframe.style.display = 'none';
    }

    card.classList.remove('playing', 'loading', 'error');
    card.dataset.playing = '0';

    if (poster) poster.style.opacity = '1';

    if (state.activeCard === card) {
      state.activeCard = null;
    }
  }

  function stopAllCards(exceptCard = null) {
    document.querySelectorAll('.card').forEach(card => {
      if (exceptCard && card === exceptCard) return;
      if (card.dataset.playing === '1') stopCard(card);
    });
  }

  function startVideoCard(card, url) {
    const video = card.querySelector('.video-media');
    const iframe = card.querySelector('.iframe-media');

    if (!video) return;

    iframe.src = '';
    iframe.style.display = 'none';

    video.style.display = 'block';
    if (video.src !== url) {
      video.src = url;
    }

    card.classList.add('playing', 'loading');
    card.classList.remove('error');
    card.dataset.playing = '1';

    const playPromise = video.play();
    if (playPromise && typeof playPromise.catch === 'function') {
      playPromise.catch(() => {
        card.classList.remove('loading');
      });
    }

    state.activeCard = card;
  }

  function startIframeCard(card, url) {
    const video = card.querySelector('.video-media');
    const iframe = card.querySelector('.iframe-media');

    if (video) {
      video.pause();
      video.removeAttribute('src');
      video.load();
      video.style.display = 'none';
    }

    iframe.style.display = 'block';
    if (iframe.src !== url) {
      iframe.src = url;
    }

    card.classList.add('playing', 'loading');
    card.classList.remove('error');
    card.dataset.playing = '1';

    state.activeCard = card;
  }

  function activateCard(card) {
    if (!card) return;
    if (state.activeCard === card && card.dataset.playing === '1') return;

    stopAllCards(card);

    const kind = card.dataset.kind;
    const primary = card.dataset.primaryUrl;

    if (kind === 'video') {
      startVideoCard(card, primary);
    } else {
      startIframeCard(card, primary);
    }
  }

  function updatePlaybackByScroll() {
    const cards = [...document.querySelectorAll('.card')];
    if (!cards.length) return;

    const viewportCenter = window.innerHeight * 0.5;
    let bestCard = null;
    let bestDistance = Infinity;

    for (const card of cards) {
      const rect = card.getBoundingClientRect();
      if (rect.bottom < 0 || rect.top > window.innerHeight) continue;

      const center = (rect.top + rect.bottom) / 2;
      const distance = Math.abs(center - viewportCenter);

      if (distance < bestDistance) {
        bestDistance = distance;
        bestCard = card;
      }
    }

    if (bestCard && bestDistance < window.innerHeight * 0.42) {
      activateCard(bestCard);
    } else if (state.activeCard) {
      stopCard(state.activeCard);
    }
  }

  function schedulePlaybackUpdate() {
    if (state.rafPending) return;
    state.rafPending = true;

    requestAnimationFrame(() => {
      state.rafPending = false;
      updatePlaybackByScroll();
      maybeLoadMore();
    });
  }

  function maybeLoadMore() {
    if (feed.scrollHeight - feed.scrollTop - feed.clientHeight < 1200) {
      loadContent();
    }
  }

  feed.addEventListener('scroll', schedulePlaybackUpdate, { passive: true });
  window.addEventListener('resize', schedulePlaybackUpdate);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopAllCards();
    } else {
      schedulePlaybackUpdate();
    }
  });

  window.addEventListener('beforeunload', () => {
    stopAllCards();
  });

  if (localStorage.getItem('age_verified_v2')) {
    document.getElementById('age-gate').style.display = 'none';
    state.isAppStarted = true;
    loadContent(true);
  }
</script>
</body>
</html>
