<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>SHORTXX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #fff; font-family: sans-serif; overflow: hidden; height: 100dvh; }

    #age-gate {
      position: fixed; inset: 0; background: #111;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 100; gap: 24px; padding: 32px;
    }
    .logo-big { font-size: 36px; font-weight: 700; letter-spacing: 2px; }
    .logo-big span { color: #E24B4A; }
    .age-text { font-size: 15px; color: #aaa; text-align: center; line-height: 1.7; }
    .age-btn {
      width: 100%; max-width: 280px; padding: 14px;
      background: #E24B4A; color: #fff; border: none;
      border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer;
    }
    .age-no { font-size: 13px; color: #666; cursor: pointer; }

    #feed {
      height: 100dvh; overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    #feed::-webkit-scrollbar { display: none; }

    .card {
      height: 100dvh; scroll-snap-align: start;
      position: relative; background: #1a0808;
      display: flex; align-items: center; justify-content: center;
    }
    .play-btn {
      width: 60px; height: 60px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
    }
    .play-triangle {
      width: 0; height: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 22px solid rgba(255,255,255,0.8);
      margin-left: 5px;
    }

    .badge {
      display: inline-block; font-size: 11px; font-weight: 500;
      padding: 3px 8px; border-radius: 4px; margin-bottom: 6px;
      background: #E24B4A; color: #fff;
    }
    .overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 20px 16px 40px;
      background: linear-gradient(transparent, rgba(0,0,0,0.92));
    }
    .actress { font-size: 13px; color: #E24B4A; font-weight: 500; margin-bottom: 4px; }
    .title { font-size: 14px; color: #fff; font-weight: 500; margin-bottom: 14px; line-height: 1.5; }
    .cta {
      width: 100%; padding: 14px; background: #E24B4A;
      color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 500; cursor: pointer;
    }

    .top-bar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 52px; z-index: 10;
      background: linear-gradient(#111 50%, transparent);
      display: flex; align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .logo-top {
      font-size: 16px; font-weight: 700; letter-spacing: 1px;
    }
    .logo-top span { color: #E24B4A; }

    .tags {
      position: fixed; top: 52px; left: 0; right: 0;
      display: flex; gap: 8px; padding: 0 16px 12px;
      overflow-x: auto; scrollbar-width: none; z-index: 10;
    }
    .tags::-webkit-scrollbar { display: none; }
    .tag {
      flex-shrink: 0; padding: 6px 14px;
      background: rgba(255,255,255,0.1);
      border: 0.5px solid rgba(255,255,255,0.2);
      border-radius: 20px; font-size: 12px; color: #fff; cursor: pointer;
      white-space: nowrap;
    }
    .tag.active { background: #E24B4A; border-color: #E24B4A; }

    .side-actions {
      position: absolute; right: 12px; bottom: 140px;
      display: flex; flex-direction: column; gap: 20px; align-items: center;
    }
    .side-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer;
    }
    .side-icon {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .side-label { font-size: 11px; color: #ccc; }
  </style>
</head>
<body>

<div id="age-gate">
  <div class="logo-big">SHORT<span>XX</span></div>
  <p class="age-text">本サイトは成人向けコンテンツを含みます。<br>18歳以上の方のみご利用いただけます。</p>
  <button class="age-btn" onclick="enterSite()">18歳以上です・入場する</button>
  <span class="age-no" onclick="location.href='https://www.google.com'">18歳未満・退場する</span>
</div>

<div class="top-bar">
  <div class="logo-top">SHORT<span>XX</span></div>
</div>

<div class="tags">
  <div class="tag active" onclick="setTag(this)">すべて</div>
  <div class="tag" onclick="setTag(this)">素人</div>
  <div class="tag" onclick="setTag(this)">巨乳</div>
  <div class="tag" onclick="setTag(this)">NTR</div>
  <div class="tag" onclick="setTag(this)">個人撮影</div>
  <div class="tag" onclick="setTag(this)">初撮り</div>
  <div class="tag" onclick="setTag(this)">人妻</div>
  <div class="tag" onclick="setTag(this)">美少女</div>
</div>

<div id="feed">
  <div class="card">
    <div class="play-btn"><div class="play-triangle"></div></div>
    <div class="side-actions">
      <div class="side-btn"><div class="side-icon">♡</div><span class="side-label">いいね</span></div>
      <div class="side-btn"><div class="side-icon">↷</div><span class="side-label">スキップ</span></div>
    </div>
    <div class="overlay">
      <span class="badge">昨日の売上1位</span>
      <div class="actress">桃乃木かな</div>
      <div class="title">憧れの先輩と二人きりの放課後…神スタイル美女の初撮り</div>
      <button class="cta" onclick="location.href='https://fanza.com'">続きを見る →</button>
    </div>
  </div>

  <div class="card">
    <div class="play-btn"><div class="play-triangle"></div></div>
    <div class="side-actions">
      <div class="side-btn"><div class="side-icon">♡</div><span class="side-label">いいね</span></div>
      <div class="side-btn"><div class="side-icon">↷</div><span class="side-label">スキップ</span></div>
    </div>
    <div class="overlay">
      <span class="badge">SNSでバズ中</span>
      <div class="actress">三上悠亜</div>
      <div class="title">人気急上昇中の美少女が魅せる衝撃の素顔</div>
      <button class="cta" onclick="location.href='https://fanza.com'">続きを見る →</button>
    </div>
  </div>

  <div class="card">
    <div class="play-btn"><div class="play-triangle"></div></div>
    <div class="side-actions">
      <div class="side-btn"><div class="side-icon">♡</div><span class="side-label">いいね</span></div>
      <div class="side-btn"><div class="side-icon">↷</div><span class="side-label">スキップ</span></div>
    </div>
    <div class="overlay">
      <span class="badge">人気急上昇</span>
      <div class="actress">河北彩花</div>
      <div class="title">美人妻の秘密の時間…夫には絶対言えない午後</div>
      <button class="cta" onclick="location.href='https://fanza.com'">続きを見る →</button>
    </div>
  </div>
</div>

<script>
  function enterSite() {
    document.getElementById('age-gate').style.display = 'none';
    localStorage.setItem('age_verified', '1');
  }
  if (localStorage.getItem('age_verified')) {
    document.getElementById('age-gate').style.display = 'none';
  }
  function setTag(el) {
    document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
  }
</script>
</body>
</html>
